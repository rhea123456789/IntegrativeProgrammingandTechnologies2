<div class="page">
  <div class="about-card">
    <h1>{{ profile.title }}</h1>

    <img
      class="profile-image"
      [src]="profile.image"
      [alt]="profile.name"
    />

    <textarea
      class="about-input"
      [(ngModel)]="profile.about"
      rows="10">
    </textarea>

    <div class="info-section">
      <p><strong>Email:</strong> {{ profile.email }}</p>
      <p><strong>Phone:</strong> {{ profile.phone }}</p>
      <p><strong>Skills:</strong> {{ profile.skills }}</p>
    </div>
  </div>
</div>
