<div *ngIf="currentView === 'login'" class="login-page">
  <div class="login-card">
    <div class="login-left">
      <img src="login-image.png" alt="Login Illustration" class="login-illustration" />
    </div>

    <div class="login-right">
      <h1>Let’s sign you in.</h1>
      <p>Welcome back to your account</p>

      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="loginData.email"
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="loginData.password"
      />

      <button class="login-btn" (click)="login()">Login now</button>

      <div class="register-link-text">
        Don’t have an account?
        <span class="register-link" (click)="goToRegister()">Register here</span>
      </div>
    </div>
  </div>
</div>

<div *ngIf="currentView === 'register'" class="register-page">
  <div class="register-card">
    <h1>Register Account</h1>

    <input
      type="text"
      placeholder="Full Name"
      [(ngModel)]="registerData.fullName"
    />

    <input
      type="text"
      placeholder="Username"
      [(ngModel)]="registerData.username"
    />

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="registerData.email"
    />

    <input
      type="text"
      placeholder="Contact Number"
      [(ngModel)]="registerData.contactNumber"
    />

    <input
      type="text"
      placeholder="Address"
      [(ngModel)]="registerData.address"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="registerData.password"
    />

    <input
      type="password"
      placeholder="Confirm Password"
      [(ngModel)]="registerData.confirmPassword"
    />

    <button class="register-btn" (click)="register()">Register</button>

    <div class="back-login-text">
      Already have an account?
      <span class="back-login-link" (click)="goToLogin()">Go to Login</span>
    </div>
  </div>
</div>

<div *ngIf="currentView === 'portfolio'" class="portfolio-page">
  <div class="about-card">
    <h1>{{ profile.title }}</h1>

    <img
      class="profile-image"
      [src]="profile.image"
      [alt]="profile.name"
    />

    <textarea
      class="about-input"
      [(ngModel)]="profile.about"
      rows="10">
    </textarea>

    <div class="info-section">
      <p><strong>Email:</strong> {{ profile.email }}</p>
      <p><strong>Phone:</strong> {{ profile.phone }}</p>
      <p><strong>Skills:</strong> {{ profile.skills }}</p>
    </div>
  </div>
</div>
